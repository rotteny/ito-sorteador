name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez; o seguinte espera (cancelar no meio de um rsync deixaria o site misturado).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Forks nao tem os secrets: sem esse guard o push na main de um fork falharia sempre.
    if: github.repository == 'rotteny/ito-sorteador'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ito.gorilash.com.br
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Chave restrita (rrsync na pasta do site) e host key fixa: nada de ssh-keyscan no CI.
      - name: Preparar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"

      - name: Deploy
        env:
          SKIP_BUILD: "1"
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY: ${{ runner.temp }}/deploy_key
          DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/known_hosts
          PUBLIC_URL: https://ito.gorilash.com.br
        run: bash scripts/deploy.sh

      - name: Limpar chave
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
